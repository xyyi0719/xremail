[workspace]
# edition 2024 隐含 resolver 3（MSRV 感知的特性解析），显式写出避免旧默认值。
resolver = "3"
members = [
    "crates/xremail-core",
    "crates/xremail-store",
    "crates/xremail-crypto",
    "crates/xremail-api",
    "crates/xremail-sync",
    "crates/xremail-protocol-imap",
    "crates/xremail-protocol-smtp",
    "crates/xremail-testkit",
    "crates/xremail-message",
    "crates/xremail-dkim",
    "crates/xremail-diagnostics",
    "apps/shell/src-tauri",
]

# ---------------------------------------------------------------------------
# 工作区共享元数据
# ---------------------------------------------------------------------------
[workspace.package]
version = "0.2.0"
edition = "2024"
# sqlx 0.9.0 声明的 MSRV 是 1.94.0。原先的 1.88 在引入 sqlx 后会成为
# 假声明，故随依赖一起上提。取 sqlx 的 MSRV 与本仓库 edition 要求的较大者。
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = ["xyyi0719"]
repository = "https://github.com/xyyi0719/xremail"

# ---------------------------------------------------------------------------
# 工作区共享依赖
# 升级版本时只改这里一处。
# ---------------------------------------------------------------------------
[workspace.dependencies]
xremail-core = { path = "crates/xremail-core" }
xremail-store = { path = "crates/xremail-store" }
# **当前没有任何 crate 依赖它**——它服务的是 P6 的 L2（端到端加密同步），
# 见 ARCHITECTURE §8。`xremail-api` 的 L2 契约与 `xremail-crypto` 的密文封装
# 都已就位并有测试，只是还没有调用方。`cargo +nightly clippy` 会报
# 「unused workspace dependency」——那是**预期**的，不是缺陷。
xremail-crypto = { path = "crates/xremail-crypto" }
xremail-api = { path = "crates/xremail-api" }
xremail-sync = { path = "crates/xremail-sync" }
xremail-protocol-imap = { path = "crates/xremail-protocol-imap" }
xremail-protocol-smtp = { path = "crates/xremail-protocol-smtp" }
xremail-message = { path = "crates/xremail-message" }
xremail-dkim = { path = "crates/xremail-dkim" }
xremail-testkit = { path = "crates/xremail-testkit" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 字符集解码（UTF-8 / GBK / GB18030 / Big5 / …）。
encoding_rs = "0.8"
# MIME 的 base64 传输编码。
base64 = "0.22"
# RSA / SHA-256 / Ed25519 的原语（DKIM 签名用）。
# 版本与 rustls 拉进来的同一份：依赖图里只有一个 ring 0.17.14。
ring = "0.17"
# 把私钥文本在使用后立刻抹掉（DKIM 私钥只在栈上待一小会儿）。
zeroize = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs"] }
tracing = "0.1"
# `FutureExt::catch_unwind`：给后台任务加 panic 边界（R13）。
# 不是新拉包——async-imap 已经依赖它，只是显式声明自己用到。
futures-util = "0.3"

# Windows 凭据管理器（平台钥匙串适配）。
# 用的就是 Tauri 已经引入的 windows 同一个版本，不额外拉新包。
# - Win32_Security_Credentials：CredWriteW / CredReadW / CredDeleteW。
# - Win32_Foundation：HRESULT / WIN32_ERROR。
# - Win32_Security：CREDENTIAL 相关的类型与常量。
windows = { version = "0.62", features = [
    "Win32_Security_Credentials",
    "Win32_Foundation",
    "Win32_Security",
] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Linux 的系统钥匙串（Secret Service，走 D-Bus）。
# 只在 Linux 上编译：其它平台有自己的原生后端（Windows 用 windows crate 直接调
# CredWriteW，见 apps/shell/src-tauri/src/secrets/windows_store.rs）。
# 选 sync-secret-service 而不是链 libsecret：见 secrets/linux_store.rs 的模块文档。
# keyring 的**平台特性由使用方挑**：Linux 要 `sync-secret-service`（D-Bus），
# Android 走 `android-keyring` 构建器（不需要 D-Bus）。把它写在这里会让
# Android 目标也强行拉进 Linux 的 D-Bus 依赖——`cargo check --target
# aarch64-linux-android` 实测报 `unresolved import keyring`。
keyring = { version = "3", default-features = false }


# SQLite 访问层。特性说明：
# - sqlite-bundled：自带 SQLite 源码编译，不依赖系统安装的 sqlite3，
#   Windows 与 Android 打包时省去外部依赖。
# - 不启用 sqlite-load-extension：不引入动态扩展加载能力，减少攻击面。
# - runtime-tokio：与 workspace 的 tokio 运行时一致。
# - macros：启用 query_as! 等编译期校验宏（依赖 .sqlx/ 离线查询数据）。
# - migrate：启用 sqlx::migrate!()，把迁移在编译期内嵌进二进制。
sqlx = { version = "0.9", default-features = false, features = [
    "sqlite-bundled",
    "runtime-tokio",
    "macros",
    "migrate",
] }

# ---------------------------------------------------------------------------
# 发布配置
# 放在根 workspace：子 package 里的 profile 会被 cargo 忽略。
#
# panic 策略已决策为 "unwind"（R13）：
# "abort" 体积更小，但任一 panic 会终止整个进程，后台同步任务无法用
# catch_unwind 兜底。P0 引入 tokio 异步任务后，"unwind" 可让 tokio 任务
# 级别的 panic 不至于拖垮应用（见 docs/ISSUES_AND_RISKS.md R13）。
# ---------------------------------------------------------------------------
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
